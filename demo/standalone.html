<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>span-magnitude-viz — standalone thin-arc preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #090807;
        color: #e7e5e4;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      main { max-width: 1000px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      h1 span { color: #f5a623; }
      p { margin: 0 0 16px; color: #a8a29e; font-size: 14px; line-height: 1.5; max-width: 62ch; }
      .meta {
        margin-bottom: 12px;
        font-size: 12px;
        color: #78716c;
        font-family: ui-monospace, monospace;
      }
      button {
        appearance: none;
        border: 1px solid #3f3a36;
        background: #1c1917;
        color: #e7e5e4;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        margin-bottom: 16px;
      }
      button:hover { border-color: #f5a623; color: #f5a623; }
      #chart-host {
        border: 1px solid #2a2622;
        border-radius: 10px;
        overflow: hidden;
        background: #0c0b09;
      }
      a { color: #f5a623; }
    </style>
  </head>
  <body>
    <main>
      <h1><span>span-magnitude-viz</span> — thin arcs preview</h1>
      <p>
        Self-contained sample (12 marks). Stroke scale is delicate:
        <code>scaleSqrt → [0.45, 2.1]</code> with softer arc opacity.
        Full interactive demo:
        <a href="/">index.html</a>.
      </p>
      <div class="meta">Open via Vite: http://127.0.0.1:5173/standalone.html</div>
      <button type="button" id="replay">Replay</button>
      <div id="chart-host"></div>
    </main>
    <script type="module" src="./standalone.ts"></script>
  </body>
</html>
